<app-header></app-header>
<app-carrocel [stats]="stats" [carregando]="carregando" [statsCarregados]="statsCarregados">
</app-carrocel>
<ion-content>

  <div class="page">

    <h1>Máquinas</h1>

    <ul class="lista">

      @for (m of maquinas.slice(0,5); track m.id) {

      <li>

        <button class="cartao" (click)="toggle(m.id)">

          <div class="cartao-topo">

            <div class="cartao-texto">

              <strong>
                {{ m.nome }}
              </strong>

              <small>
                {{ m.setor }}
              </small>

            </div>

            <ion-icon [name]="expandida === m.id ? 'chevron-up-outline' : 'chevron-down-outline'">
            </ion-icon>

          </div>

        </button>

        @if (expandida === m.id) {

<app-machine-card
  [maquina]="m"
  modo="consulta"
  (editar)="editar($event)"
  (excluir)="excluir($event)">
</app-machine-card>        }

      </li>

      }

    </ul>

  </div>

</ion-content>
